
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafetería: Simulador de Pedidos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>☕ Cafetería Central: Simulador de Pedidos</h1>
      <p class="subtitle">Demostración del Event Loop, Promises y Async/Await en JavaScript</p>
    </header>

    <div class="actions">
      <button id="addOrderBtn" class="btn primary-btn">➕ Agregar Pedido</button>
      <div id="stats" class="stats-bar">
        <span>Pedidos Activos: <strong id="activeCount">0</strong></span>
        <span>Pedidos Completados: <strong id="completedCount">0</strong></span>
      </div>
    </div>

    <main class="orders-section">
      <h2>Cola de Pedidos</h2>
      <ul id="orderList" class="order-list"></ul>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
